name: Java CI

on:
  push:
    branches: [main, master, dev, 26.2]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and Test
        run: mvn -B verify
      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MiaoMenu-${{ github.sha }}
          path: target/*.jar
