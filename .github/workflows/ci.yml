name: Java CI
run-name: 适配 Floodgate 2.2.6

on:
  push:
    branches: [26.2]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build jar
        run: mvn -B package -DskipTests
      - name: Read version & drop original jar
        id: meta
        run: |
          JAR=$(ls target/MiaoMenu-*.jar | head -1)
          RAW=$(basename "$JAR" .jar)
          RAW=${RAW#MiaoMenu-}
          VER=${RAW#V}
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          rm -f target/original-*.jar
      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('ci-{0}', github.sha) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('V{0}', steps.meta.outputs.version) }}
          prerelease: false
          files: target/*.jar
          body: |
            ## 更新内容
            
            - MiaoMenu 3.1 用反射调用 Floodgate `sendForm`。原 `findSendFormMethod` 仅按「方法名 + 2 参 + 首参 UUID」取第一个匹配。
            - Floodgate 2.2.6+ 新增 `sendForm(UUID, FormBuilder)` 等重载并排到前面，导致误选错误重载、传入已 build 的 Form 对象，触发 `IllegalArgumentException: argument type mismatch`。
            - 本补丁改为用 `Class.forName("org.geysermc.cumulus.form.Form")` 精确匹配第二个参数为 Cumulus 1.x `Form` 接口的重载，与重载声明顺序无关，因此同时兼容 Floodgate 2.2.5 与 2.2.6+。
            - 已在服务器实机测试通过。
            
            > 参考：Yamada0001/MiaoMenu#12
      - name: Remove original asset from release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          tag = "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('ci-{0}', github.sha) }}"
          tok = os.environ['GH_TOKEN']
          h = {'Authorization': 'Bearer ' + tok, 'Accept': 'application/vnd.github+json'}
          rel = json.load(urllib.request.urlopen(urllib.request.Request(f'https://api.github.com/repos/{repo}/releases/tags/{tag}', headers=h)))
          for a in rel['assets']:
              if a['name'].startswith('original-'):
                  req = urllib.request.Request(a['url'], method='DELETE')
                  req.add_header('Authorization', 'Bearer ' + tok)
                  urllib.request.urlopen(req)
                  print('deleted', a['name'])
          PY
